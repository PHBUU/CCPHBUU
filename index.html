<script>
/* ============================================================
   ⚙️ ตั้งค่า — แก้เฉพาะส่วนนี้
   เมื่อ deploy Apps Script แล้วได้ URL ใหม่ ให้แก้ GAS_URL บรรทัดเดียว
   (ลิงก์ที่ส่งให้คนอื่นยังเป็นลิงก์ GitHub เดิมเสมอ)

var CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwIRkGRaS7b572zQgkeKZr-8Dw-UnBsJAIJK3K0AO_u-FTfs4VptpYKQ0BO6vXUwZTvRQ/exec',

  // เปิดเป็น true เมื่อต้องการปิดระบบชั่วคราว (ไม่ต้องแตะ Apps Script)
  MAINTENANCE: false,
  MAINTENANCE_TITLE: 'ปิดปรับปรุงระบบชั่วคราว',
  MAINTENANCE_MSG: 'ระบบจะกลับมาให้บริการเร็วๆ นี้ หากต้องการติดต่อด่วน กรุณาติดต่อเจ้าหน้าที่',

  CONTACT_PHONE: '038-102730',
  CONTACT_LINE: 'https://bit.ly/CCPHBUU',

  // ถ้าโหลดเกินกี่วินาที ให้แสดงปุ่ม "เปิดระบบโดยตรง"
  SLOW_SECONDS: 15
};

<style>
/* ธีมเดียวกับระบบ: เขียวหมึก + ทองตราประทับ, ใบประกาศเอียงเล็กน้อย */
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0E3B2E;--g:#1F7A55;--gold:#B8862B;--gold-l:#E9C977;--paper:#FDFCF8;--muted:#5E6E66}
html,body{height:100%}
body{font-family:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--ink);color:#1C2A24;overflow:hidden}
[hidden]{display:none!important}

#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F5F7F4;opacity:0;transition:opacity .35s ease}
#app.ready{opacity:1}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.25rem;text-align:center;z-index:2;
  background:var(--ink);background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;transition:opacity .35s ease;overflow:hidden}
.screen::before{content:'';position:absolute;right:-140px;top:-140px;width:460px;height:460px;border-radius:50%;
  border:1px solid rgba(233,201,119,.18);box-shadow:0 0 0 60px rgba(233,201,119,.04),0 0 0 120px rgba(233,201,119,.03)}
.screen.gone{opacity:0;pointer-events:none}

/* การ์ดใบประกาศ */
.cert{position:relative;width:100%;background:var(--paper);border-radius:6px;padding:2.25rem 1.75rem 1.9rem;
  box-shadow:0 30px 60px rgba(0,0,0,.35);transform:rotate(-2deg)}
.cert::before{content:'';position:absolute;inset:10px;border:1.5px solid #D9C28B;border-radius:3px;pointer-events:none}
.stack{position:relative;width:100%;max-width:400px;animation:in .6s cubic-bezier(.2,.8,.2,1) backwards}
.stack::before{content:'';position:absolute;inset:0;transform:rotate(3deg) translate(12px,9px);background:#E3EBE6;border-radius:6px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
@keyframes in{from{opacity:0;transform:rotate(-4deg) translateY(24px)}to{opacity:1;transform:none}}
.logo{width:64px;height:64px;border-radius:16px;background:var(--ink);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.logo svg{width:38px;height:38px}
.t1{font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:26px;font-weight:600;color:var(--ink);line-height:1.2}
.t2{font-size:14px;color:var(--muted);margin:.4rem auto 0;max-width:30ch;line-height:1.6}
.rule{height:1px;background:linear-gradient(90deg,transparent,#D9C28B,transparent);margin:1.25rem 1rem}
.bar{width:170px;height:4px;border-radius:4px;background:#E7EEE9;overflow:hidden;margin:0 auto .75rem}
.bar i{display:block;width:40%;height:100%;background:var(--g);border-radius:4px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.t3{font-size:13px;color:var(--g);font-weight:500}
.seal{position:absolute;right:-16px;top:-20px;width:62px;height:62px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 4px var(--paper),0 0 0 5px #D9C28B,0 8px 18px rgba(0,0,0,.25);transform:rotate(10deg)}
.seal svg{width:30px;height:30px}

.slow{margin-top:1.1rem;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.6rem}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--g);color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 20px;border-radius:10px}
.btn:hover{background:var(--ink)}
.btn:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #DDE5E0}
.maint h2{font-family:'Prompt','Noto Sans Thai',sans-serif;font-size:19px;font-weight:600;color:var(--ink);margin-bottom:.5rem}
.maint p{font-size:14px;line-height:1.7;color:var(--muted)}
.maint .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:1.1rem}
.foot{position:relative;margin-top:2.25rem;font-size:12px;color:rgba(255,255,255,.55)}
@media (max-width:420px){.cert{padding:2rem 1.25rem 1.6rem}.t1{font-size:23px}.seal{right:-6px}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}.stack{animation:none}#app,.screen{transition:none}}
</style>
</head>
<body>

<div id="splash" class="screen" role="status" aria-live="polite">
  <div class="stack"><div class="cert">

    <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14 6 26l26 12 26-12z" fill="#E9C977"/><path d="M17 32v9c0 4.5 6.7 9 15 9s15-4.5 15-9v-9l-15 7z" fill="#E9C977"/><path d="M54 27v13" stroke="#E9C977" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="t1">CCPH-BUU</div>
    <div class="t2">ศูนย์การศึกษาต่อเนื่องสภาวิชาชีพการสาธารณสุขชุมชน คณะสาธารณสุขศาสตร์ มหาวิทยาลัยบูรพา</div>
    <div class="rule"></div>
    <div class="bar"><i></i></div>
    <div class="t3">กำลังเปิดระบบ...</div>
    <div id="slow" class="slow" hidden>
      <span>ระบบใช้เวลาโหลดนานกว่าปกติ</span>
      <a id="direct" class="btn" target="_top" rel="noopener">เปิดระบบโดยตรง</a>
    </div>
  </div></div>
  <div class="foot">ลงทะเบียนอบรม · เก็บคะแนน CPD · ตรวจสอบใบรับรอง</div>
</div>

<div id="maint" class="screen" hidden>
  <div class="stack"><div class="cert maint">
    <div class="seal"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14 6 26l26 12 26-12z" fill="#fff"/><path d="M17 32v9c0 4.5 6.7 9 15 9s15-4.5 15-9v-9l-15 7z" fill="#fff"/><path d="M54 27v13" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 14 6 26l26 12 26-12z" fill="#E9C977"/><path d="M17 32v9c0 4.5 6.7 9 15 9s15-4.5 15-9v-9l-15 7z" fill="#E9C977"/><path d="M54 27v13" stroke="#E9C977" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="t1" style="margin-bottom:1rem">CCPH-BUU</div>
    <h2 id="m-title"></h2>
    <p id="m-msg"></p>
    <div class="row">
      <a id="m-phone" class="btn"></a>
      <a id="m-line" class="btn ghost" target="_blank" rel="noopener">LINE</a>
    </div>
  </div></div>
</div>

<iframe id="app" title="CCPH-BUU ระบบลงทะเบียนอบรม" allow="clipboard-write; clipboard-read"></iframe>

<noscript>
  <div class="screen"><div class="t1">กรุณาเปิดใช้งาน JavaScript</div></div>
</noscript>

<script>
(function () {
  // ส่งต่อ query string ไปให้ระบบด้วย เช่น ?course=CCPH-C2 หรือ ?page=member
  var target = CONFIG.GAS_URL + (location.search || '');
  var splash = document.getElementById('splash');
  document.getElementById('direct').href = target;

  if (CONFIG.MAINTENANCE) {
    splash.hidden = true;
    document.getElementById('maint').hidden = false;
    document.getElementById('m-title').textContent = CONFIG.MAINTENANCE_TITLE;
    document.getElementById('m-msg').textContent = CONFIG.MAINTENANCE_MSG;
    var ph = document.getElementById('m-phone');
    ph.textContent = '☎ ' + CONFIG.CONTACT_PHONE;
    ph.href = 'tel:' + CONFIG.CONTACT_PHONE.replace(/[^0-9+]/g, '');
    document.getElementById('m-line').href = CONFIG.CONTACT_LINE;
    return;
  }

  var app = document.getElementById('app');
  var loaded = false;
  app.addEventListener('load', function () {
    if (!app.getAttribute('src')) return;
    loaded = true;
    app.classList.add('ready');
    splash.classList.add('gone');
    setTimeout(function () { splash.hidden = true; }, 400);
  });
  setTimeout(function () {
    if (!loaded) document.getElementById('slow').hidden = false;
  }, CONFIG.SLOW_SECONDS * 1000);

  app.src = target;
})();
</script>
</body>
